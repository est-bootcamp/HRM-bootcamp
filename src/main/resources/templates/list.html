<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>직원 목록</title>
    <!-- AdminLTE CSS (스타일 프레임워크) -->
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <!-- Bootstrap 5 (테이블/폼 레이아웃용 보완) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <!-- 홈 버튼 (메인으로 이동) -->
    <div class="mb-3">
        <a th:href="@{/main}" class="btn btn-outline-primary">🏠 홈</a>
    </div>

    <!-- 페이지 제목 -->
    <h2>직원 목록</h2>

    <!-- 검색 폼 (이름/이메일/전화 검색) -->
    <form th:action="@{/employees}" method="get" class="d-flex mb-3">
        <!-- 검색어 입력 -->
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="이름/이메일/전화 검색"
               class="form-control me-2 w-25">
        <!-- 검색 버튼 -->
        <button type="submit" class="btn btn-primary">검색</button>
    </form>

    <!-- 신규 등록 버튼 -->
    <a th:href="@{/employees/new}" class="btn btn-success mb-3">직원 등록</a>

    <!-- 직원 목록 테이블 -->
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>이메일</th>
            <th>부서</th>
            <th>직급</th>
            <th>상태</th>
            <th>관리</th> <!-- 수정/삭제 버튼 영역 -->
        </tr>
        </thead>
        <tbody>
        <!-- 직원 리스트 반복 출력 -->
        <tr th:each="emp : ${employeePage.content}">
            <td th:text="${emp.empId}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.dprName}"></td>
            <td th:text="${emp.pstName}"></td>
            <td th:text="${emp.status}"></td>
            <td>
                <!-- 수정 버튼 -->
                <a th:href="@{'/employees/' + ${emp.empId} + '/edit'}"
                   class="btn btn-sm btn-warning">수정</a>

                <!-- 삭제 버튼 (form POST 방식) -->
                <form th:action="@{'/employees/' + ${emp.empId} + '/delete'}"
                      method="post"
                      style="display:inline;">
                    <!-- CSRF 토큰 (Spring Security 보호) -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('정말 삭제하시겠습니까?');">
                        삭제
                    </button>
                </form>
            </td>
        </tr>

        <!-- 검색 결과가 없을 때 표시 -->
        <tr th:if="${#lists.isEmpty(employeePage.content)}">
            <td colspan="7" class="text-center">검색 결과가 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <!-- 페이지네이션 -->
    <nav th:if="${employeePage.totalPages > 1}">
        <ul class="pagination justify-content-center">

            <!-- 이전 버튼 (첫 페이지에서는 disabled 처리) -->
            <li class="page-item" th:classappend="${employeePage.first}? 'disabled'">
                <a class="page-link"
                   th:href="@{/employees(page=${employeePage.page-1}, keyword=${keyword})}">이전</a>
            </li>

            <!-- 페이지 번호 목록 -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, employeePage.totalPages)}"
                th:classappend="${i == employeePage.page}? 'active'">
                <a class="page-link"
                   th:text="${i}"
                   th:href="@{/employees(page=${i}, keyword=${keyword})}"></a>
            </li>

            <!-- 다음 버튼 (마지막 페이지에서는 disabled 처리) -->
            <li class="page-item" th:classappend="${employeePage.last}? 'disabled'">
                <a class="page-link"
                   th:href="@{/employees(page=${employeePage.page+1}, keyword=${keyword})}">다음</a>
            </li>

        </ul>
    </nav>

</div>
</body>
</html>
