<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사건 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">사건 목록</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>사건명</th>
            <th>고객명</th>
            <th>사건 종류</th>
            <th>상태</th>
            <th>등록일</th>
            <th>비고</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="case : ${cases}">
            <td th:text="${case.csId}">1</td>
            <td th:text="${case.csName}">사건명</td>
            <td th:text="${case.clientName}">고객명</td>
            <td th:text="${case.csTyId}">1</td>
            <td th:text="${case.csStatus}">진행중</td>
            <td th:text="${#dates.format(case.regDate, 'yyyy-MM-dd HH:mm')}">2025-09-29</td>
            <td th:text="${case.note}">비고내용</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
