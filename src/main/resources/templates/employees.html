<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>직원 목록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h1>직원 목록</h1>
<table border="1">
    <thead>
    <tr><th>ID</th><th>이름</th><th>부서</th></tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.empId}"></td>
        <td th:text="${emp.empName}"></td>
        <td th:text="${emp.department.dprName}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
