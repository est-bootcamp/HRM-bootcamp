<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>출퇴근 관리</title>
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <div class="content-wrapper">
        <section class="content-header">
            <h1>출퇴근 관리</h1>
        </section>

        <section class="content">
            <div class="card card-primary">
                <div class="card-body">
                    <p>
                        <b>직원 ID:</b> <span id="empId" th:text="${empId}">1</span><br>
                        <b>이름:</b> <span id="empName" th:text="${empName}">홍길동</span>
                    </p>

                    <button class="btn btn-success" onclick="checkIn()">출근</button>
                    <button class="btn btn-danger" onclick="checkOut()">퇴근</button>

                    <p id="todayStatus" class="mt-3 text-primary"></p>
                </div>
            </div>

            <!-- 조회 필터 -->
            <div class="card card-secondary mt-3">
                <div class="card-body">
                    <label>조회 기간:</label>
                    <input type="date" id="startDate">
                    <input type="date" id="endDate">
                    <button class="btn btn-info btn-sm" onclick="loadAttendance()">조회</button>
                </div>
            </div>

            <!-- 근태 이력 표시 -->
            <div class="card card-info mt-3">
                <div class="card-header">
                    <h3 class="card-title">근태 이력</h3>
                </div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>근무일자</th>
                            <th>출근시간</th>
                            <th>퇴근시간</th>
                            <th>비고</th>
                        </tr>
                        </thead>
                        <tbody id="attendanceList">
                        <!-- Ajax로 데이터 로드 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    const empId = document.getElementById("empId").innerText;

    // 출근 처리
    async function checkIn() {
        try {
            const res = await axios.post(`/api/attendance/${empId}/check-in`);
            alert("출근 처리 완료: " + res.data.checkIn);
            loadAttendance();
        } catch (err) {
            alert("출근 실패: " + (err.response?.data?.message || err));
        }
    }

    // 퇴근 처리
    async function checkOut() {
        try {
            const res = await axios.post(`/api/attendance/${empId}/check-out`);
            alert("퇴근 처리 완료: " + res.data.checkOut);
            loadAttendance();
        } catch (err) {
            alert("퇴근 실패: " + (err.response?.data?.message || err));
        }
    }

    // 근태 이력 조회 (기간 선택 가능)
    async function loadAttendance() {
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;

        let url = `/api/attendance/${empId}`;
        if (start && end) {
            url += `?start=${start}&end=${end}`;
        }

        const res = await axios.get(url);
        const list = res.data;
        const tbody = document.getElementById("attendanceList");
        tbody.innerHTML = "";
        list.forEach(att => {
            tbody.innerHTML += `
                <tr>
                    <td>${att.workDate}</td>
                    <td>${att.checkIn ? att.checkIn.replace('T', ' ') : '-'}</td>
                    <td>${att.checkOut ? att.checkOut.replace('T', ' ') : '-'}</td>
                    <td>${att.note || ''}</td>
                </tr>
            `;
        });

        // 오늘자 상태 표시
        const today = new Date().toISOString().split("T")[0];
        const todayRecord = list.find(att => att.workDate === today);
        const statusEl = document.getElementById("todayStatus");
        if (todayRecord) {
            if (todayRecord.checkIn && !todayRecord.checkOut) {
                statusEl.innerText = "오늘 출근 완료 (퇴근 전)";
            } else if (todayRecord.checkIn && todayRecord.checkOut) {
                statusEl.innerText = "오늘 출퇴근 완료";
            }
        } else {
            statusEl.innerText = "오늘 출근 기록 없음";
        }
    }

    // 페이지 로드 시 이력 불러오기
    window.onload = loadAttendance;
</script>
</body>
</html>
