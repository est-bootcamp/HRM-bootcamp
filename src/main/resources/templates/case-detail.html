<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사건 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>사건 상세</h2>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${caseDetail.csName}">사건명</h5>

            <table class="table table-borderless">
                <tr>
                    <th width="20%">ID</th>
                    <td th:text="${caseDetail.csId}">1</td>
                </tr>
                <tr>
                    <th>고객명</th>
                    <td th:text="${caseDetail.clientName}">고객명</td>
                </tr>
                <tr>
                    <th>사건 종류</th>
                    <td th:text="${caseDetail.csTyId}">1</td>
                </tr>
                <tr>
                    <th>상태</th>
                    <td th:text="${caseDetail.csStatus}">진행중</td>
                </tr>
                <tr>
                    <th>등록일</th>
                    <td th:text="${#dates.format(caseDetail.regDate, 'yyyy-MM-dd HH:mm')}">2025-09-29</td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td th:text="${caseDetail.note}">비고내용</td>
                </tr>
            </table>

            <div class="d-flex gap-2">
                <a th:href="@{|/cases/${caseDetail.csId}/edit|}" class="btn btn-warning">수정</a>

                <form th:action="@{|/cases/${caseDetail.csId}/delete|}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>

                <a href="/cases" class="btn btn-secondary">목록으로</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
