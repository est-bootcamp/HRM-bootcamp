<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>휴가 등록</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <div class="mb-3">
        <a th:href="@{/main}" class="btn btn-outline-primary">🏠 홈</a>
    </div>

    <h1>휴가 등록</h1>

    <form th:action="@{/leave/new}" method="post" class="mt-4">

        <!-- 신청자 ID -->
        <div class="mb-3">
            <label class="form-label">신청자 ID</label>
            <input type="number" name="rqsEmpId" class="form-control" required>
        </div>

        <!-- 휴가 유형 코드 -->
        <div class="mb-3">
            <label class="form-label">휴가 유형 코드</label>
            <select name="leaveTypeCode" class="form-select" required>
                <option value="">-- 선택 --</option>
                <option value="1">1. 연차</option>
                <option value="2">2. 반차</option>
                <option value="3">3. 병가</option>
                <option value="4">4. 대체 휴가</option>
                <option value="5">5. 돌봄휴가</option>
                <option value="6">6. 출산휴가</option>
            </select>
        </div>

        <!-- 시작일 -->
        <div class="mb-3">
            <label class="form-label">시작일</label>
            <input type="date" name="startDate" class="form-control" required>
        </div>

        <!-- 종료일 -->
        <div class="mb-3">
            <label class="form-label">종료일</label>
            <input type="date" name="endDate" class="form-control" required>
        </div>

        <!-- 버튼 -->
        <button type="submit" class="btn btn-success">저장</button>
        <a th:href="@{/leave}" class="btn btn-secondary">목록</a>
    </form>



</div>

</body>
</html>
