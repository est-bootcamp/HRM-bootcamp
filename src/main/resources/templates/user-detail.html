<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>User Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Font Awesome 아이콘 -->
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <!-- AdminLTE 스타일 -->
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
    <!-- Google 폰트 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- 메인 컨텐츠 래퍼 -->
    <div class="content-wrapper">
        <!-- 상단 헤더 영역 -->
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <!-- 제목 -->
                    <div class="col-sm-6">
                        <h1>User Detail</h1>
                    </div>
                    <!-- Breadcrumb -->
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/users}">Users</a></li>
                            <li class="breadcrumb-item active">Detail</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <!-- 메인 콘텐츠 -->
        <section class="content">
            <div class="card card-solid">
                <div class="card-body pb-0">
                    <div class="row d-flex align-items-stretch">
                        <div class="col-12 d-flex align-items-stretch">
                            <div class="card bg-light w-100">
                                <!-- 카드 헤더 (사용자 PK 표시) -->
                                <div class="card-header text-muted border-bottom-0">
                                    사용자 번호: <span th:text="${user.usNo}"></span>
                                </div>
                                <div class="card-body pt-0">
                                    <div class="row">
                                        <!-- 왼쪽: 사용자 정보 -->
                                        <div class="col-7">
                                            <h2 class="lead">
                                                <b th:text="${user.loginId}">로그인ID</b>
                                            </h2>
                                            <p class="text-muted text-sm">
                                                <b>권한:</b> <span th:text="${user.usRole}"></span>
                                            </p>
                                            <!-- 사용자 상세 정보 리스트 -->
                                            <ul class="ml-4 mb-0 fa-ul text-muted">
                                                <li class="small">
                                                    <span class="fa-li"><i class="fas fa-lg fa-check-circle"></i></span>
                                                    사용 여부: <span th:text="${user.useYn}"></span>
                                                </li>
                                                <li class="small">
                                                    <span class="fa-li"><i class="fas fa-lg fa-calendar"></i></span>
                                                    등록일: <span th:text="${user.regDate}"></span>
                                                </li>
                                                <li class="small">
                                                    <span class="fa-li"><i class="fas fa-lg fa-edit"></i></span>
                                                    최종 수정일: <span th:text="${user.modDate}"></span>
                                                </li>
                                                <li class="small">
                                                    <span class="fa-li"><i class="fas fa-lg fa-sticky-note"></i></span>
                                                    비고: <span th:text="${user.note}"></span>
                                                </li>
                                            </ul>
                                        </div>
                                        <!-- 오른쪽: 아바타 이미지 -->
                                        <div class="col-5 text-center">
                                            <img th:src="@{/dist/img/user1-128x128.jpg}"
                                                 alt="User avatar"
                                                 class="img-circle img-fluid">
                                        </div>
                                    </div>
                                </div>
                                <!-- 하단 액션 버튼 -->
                                <div class="card-footer">
                                    <div class="text-right">
                                        <!-- 목록으로 돌아가기 -->
                                        <a th:href="@{/users}" class="btn btn-sm btn-secondary">
                                            <i class="fas fa-arrow-left"></i> 목록
                                        </a>
                                        <!-- 수정 버튼 -->
                                        <a th:href="@{|/users/${user.usNo}/edit|}" class="btn btn-sm btn-primary">
                                            <i class="fas fa-user-edit"></i> 수정
                                        </a>
                                        <!-- 삭제 버튼 (form 방식, CSRF 고려 필요) -->
                                        <form th:action="@{|/users/${user.usNo}/delete|}" method="post" style="display:inline">
                                            <button type="submit" class="btn btn-sm btn-danger"
                                                    onclick="return confirm('정말 삭제하시겠습니까?');">
                                                <i class="fas fa-trash"></i> 삭제
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div><!-- /.col -->
                    </div><!-- /.row -->
                </div>
            </div>
        </section>
    </div>
</div>

<!-- JS 로딩 -->
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
