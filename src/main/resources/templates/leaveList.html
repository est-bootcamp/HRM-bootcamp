<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>휴가 신청 목록</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <!-- 홈 버튼 -->
    <div class="mb-3">
        <a th:href="@{/main}" class="btn btn-outline-primary">🏠 홈</a>
    </div>

    <h1>휴가 신청 목록</h1>

<!--    &lt;!&ndash; 검색 폼 &ndash;&gt;
    <form th:action="@{/leave}" method="get" class="d-flex mb-3">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="신청자/승인자 검색"
               class="form-control me-2 w-25">
        <button type="submit" class="btn btn-primary">검색</button>
    </form>-->

    <a th:href="@{/leave/new}" class="btn btn-success mb-3">휴가 등록</a>
    <!-- 휴가 신청 테이블 -->
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>신청 ID</th>
            <th>신청자 성명</th>
            <th>승인자 성명</th>
            <th>휴가 유형</th>
            <th>상태</th>
            <th>시작일</th>
            <th>종료일</th>
            <th>신청일시</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leave : ${leaveRequests}" >
            <td th:text="${leave.lvId}"></td>
            <td th:text="${leave.rqsName}"></td>
            <td th:text="${leave.appName}"></td>
            <td th:text="${leave.leaveTypeName}"></td>
            <td th:text="${leave.status}"></td>
            <td th:text="${#temporals.format(leave.startDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(leave.endDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(leave.requestDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <a th:href="@{'/leave/' + ${leave.lvId} + '/edit'}" class="btn btn-sm btn-warning">수정</a>
                <a th:href="@{'/leave/' + ${leave.lvId} + '/delete'}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('삭제하시겠습니까?');">삭제</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(leaveRequests)}">
            <td colspan="9" class="text-center">검색 결과가 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
