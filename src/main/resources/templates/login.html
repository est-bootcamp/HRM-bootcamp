<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>HRD Bootcamp | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS (static/css, static/dist/js 기준) -->
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <!-- 로그인 상단 로고 -->
    <div class="login-logo">
        <a href="#"><b>HRD</b>Bootcamp</a>
    </div>

    <!-- 로그인 카드 -->
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">로그인 해주세요</p>

            <!-- 로그인 폼 (Spring Security formLogin 과 연동됨)
                 - action="/doLogin" 은 SecurityConfig.filterChain()에서 loginProcessingUrl("/doLogin")으로 설정됨
                 - name="loginId" / name="password" 는 SecurityConfig에서 usernameParameter, passwordParameter 와 매핑됨
            -->
            <form th:action="@{/doLogin}" method="post">
                <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

                <!-- 아이디 입력 -->
                <div class="input-group mb-3">
                    <input type="text" name="loginId" class="form-control" placeholder="아이디" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-user"></span></div>
                    </div>
                </div>

                <!-- 비밀번호 입력 -->
                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-lock"></span></div>
                    </div>
                </div>

                <!-- 로그인 옵션 및 버튼 -->
                <div class="row">
                    <div class="col-8">
                        <div class="icheck-primary">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember Me</label>
                        </div>
                    </div>
                    <div class="col-4">
                        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                    </div>
                </div>
            </form>

            <!-- 로그인 에러 메시지 표시 -->
            <div th:if="${param.error}" class="text-danger mt-2">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <!-- 로그아웃 성공 시 메시지 -->
            <div th:if="${param.logout}" class="text-success mt-2">
                로그아웃되었습니다.
            </div>
        </div>
    </div>
</div>

<!-- 필수 JS 라이브러리 로드 -->
<!-- jQuery -->
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>

<!-- Bootstrap -->
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- AdminLTE -->
<script th:src="@{/dist/js/adminlte.min.js}"></script>

<!-- 페이지별 JS (예: ControlSidebar.js) -->
<script th:src="@{/dist/js/pages/ControlSidebar.js}"></script>
</body>
</html>
