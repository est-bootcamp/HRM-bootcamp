<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사건 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>사건 등록</h2>

    <form th:action="@{/cases/new}" th:object="${caseForm}" method="post">

        <div class="mb-3">
            <label for="csName" class="form-label">사건명</label>
            <input type="text" class="form-control" id="csName" th:field="*{csName}" required>
        </div>

        <div class="mb-3">
            <label for="clientName" class="form-label">고객명</label>
            <input type="text" class="form-control" id="clientName" th:field="*{clientName}" required>
        </div>

        <div class="mb-3">
            <label for="csTyId" class="form-label">사건 종류 ID</label>
            <input type="number" class="form-control" id="csTyId" th:field="*{csTyId}" required>
        </div>

        <div class="mb-3">
            <label for="csStatus" class="form-label">상태</label>
            <select class="form-control" id="csStatus" th:field="*{csStatus}" required>
                <option value="">선택하세요</option>
                <option value="진행중">진행중</option>
                <option value="완료">완료</option>
                <option value="보류">보류</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="note" class="form-label">비고</label>
            <textarea class="form-control" id="note" th:field="*{note}" rows="3"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">등록</button>
            <a href="/cases" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
