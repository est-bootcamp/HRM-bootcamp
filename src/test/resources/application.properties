spring.application.name=est-bootcamp

# --- DataSource(MySQL) ---
spring.datasource.url=jdbc:mysql://my8003.gabiadb.com:3306/bootcamp?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=bootcamp
spring.datasource.password=boot2025camp#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=none

# SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# MySQL 8 Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=10000

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Logging ---
debug=false
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
